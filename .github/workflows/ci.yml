name: CINF100 CI

on:

  # Trabajo cotidiano.
  # Cada push a desa genera evidencia técnica.
  push:
    branches:
      - desa

  # Entrega formal.
  # Solo evaluamos PR cuyo destino es main.
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: cinf100-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  repository-validation:
    name: repository-validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md

      - name: Validate directories
        run: |
          test -d frontend
          test -d backend
          test -d docs
          test -d tests

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest

    # Misma base que docker-compose.yml, solo para las pruebas.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devhub
          POSTGRES_PASSWORD: devhub
          POSTGRES_DB: cinf100
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devhub -d cinf100"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      PGHOST: localhost
      PGUSER: devhub
      PGPASSWORD: devhub
      PGDATABASE: cinf100
      DATABASE_URL: postgresql://devhub:devhub@localhost:5432/cinf100
      JWT_SECRET: clave-solo-para-el-ci

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migrations and seed
        env:
          DATABASE_DIR: database
        run: sh database/migrate.sh

      - name: Run database tests
        run: |
          psql -v ON_ERROR_STOP=1 -f database/tests/usuarios_restricciones.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/viajes_restricciones.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/reservas_restricciones.sql

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck and build
        working-directory: backend
        run: npm run build

      - name: Run backend tests
        working-directory: backend
        run: npm test

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend
        id: frontend
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Run tests
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm test --if-present

      - name: Run build
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build --if-present

  delivery-check:
    name: delivery-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:

      - name: Validate delivery branches
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          echo "Base branch: $BASE_BRANCH"
          echo "Source branch: $HEAD_BRANCH"

          if [ "$BASE_BRANCH" != "main" ]; then
            echo "ERROR: La entrega debe tener main como destino."
            exit 1
          fi

          if [ "$HEAD_BRANCH" != "desa" ]; then
            echo "ERROR: La entrega oficial debe realizarse desde desa."
            exit 1
          fi

          echo "Entrega válida: desa -> main"

      - name: Delivery metadata
        run: |
          echo "PR #${{ github.event.pull_request.number }}"
          echo "Author: ${{ github.event.pull_request.user.login }}"
          echo "Created: ${{ github.event.pull_request.created_at }}"
          echo "Updated: ${{ github.event.pull_request.updated_at }}"